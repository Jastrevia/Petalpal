<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      Phones: the page itself never zooms (the Garden has its own pinch zoom). A zoomed page
      pushed the calendar and the bottom icons off screen until a refresh; iOS also zoomed in
      on any text field with a font under 16px. viewport-fit=cover lets safe-area insets reach
      the app, so nothing sits under the notch or the home indicator.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>PetalPal</title>
    <style id="expo-reset">
      /* Full height that follows the browser's own bars: dvh shrinks while Safari or Chrome
         show their toolbars, so the bottom icons are never underneath them. */
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
      /* The page never scrolls, bounces or pulls to refresh; ScrollViews scroll inside it. */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        /* No double-tap zoom and no grey tap flash. */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Boot loading screen: Letterwing flying along the progress bar. It is plain HTML so it shows
         while the app's code and graphics engine download; React replaces it on its first render with
         the same screen in the same place (PigeonLoadingExperience.tsx, same sizes and timings). Nothing
         is measured yet, so a band sweeps to and fro and the bird follows its centre, turning at each
         end. The script after the markup puts every animation on the page clock that React uses too. */
      #pp-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 0 16px 240px; background: #EEF3E6; font-family: serif; overflow: hidden; }
      #pp-boot .halo { position: absolute; width: 640px; height: 640px; top: 50%; left: 50%; margin: -400px 0 0 -320px;
        background: radial-gradient(closest-side, #FFF9EAF2 0%, #FFF9EA99 45%, #FFF9EA00 100%); }
      #pp-boot .stage { position: relative; display: flex; flex-direction: column; align-items: center; }
      #pp-boot .sky { height: 142px; }
      #pp-boot .bar { position: relative; width: max(120px, min(380px, calc(100vw - 194px))); height: 44px; margin: 0 52px;
        display: flex; align-items: center; }
      #pp-boot .track { position: relative; box-sizing: border-box; width: 100%; height: 16px; border-radius: 8px; border: 1.5px solid #C8A55E;
        background: #FBF6EA; padding: 1.5px; box-shadow: 0 1px 6px #9E804D33, inset 0 1px 2px #9E804D22; }
      #pp-boot .inner { position: relative; height: 100%; border-radius: 6px; overflow: hidden; }
      #pp-boot .band { position: absolute; top: 0; bottom: 0; width: 32%; border-radius: 6px;
        background: linear-gradient(180deg, #7DBDC2 0%, #5AA4AB 55%, #4F979E 100%); }
      #pp-boot .band::after { content: ''; position: absolute; left: 4px; right: 4px; top: 1.5px; height: 3px; border-radius: 2px; background: #fff; opacity: .32; }
      #pp-boot .band, #pp-boot .mover { animation: 1.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      #pp-boot .band { animation-name: pp-band; } #pp-boot .mover { animation-name: pp-follow; }
      #pp-boot .rail { position: absolute; left: 3px; right: 3px; bottom: 16px; height: 116px; pointer-events: none; }
      #pp-boot .mover { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
      #pp-boot .face { position: absolute; left: -85px; bottom: 0; width: 170px; height: 116px; animation: pp-face 3.2s linear infinite; }
      #pp-boot .bob { width: 100%; height: 100%; filter: drop-shadow(0 5px 6px #6B5A3A22); animation: pp-bob 2.6s ease-in-out infinite alternate; }
      #pp-boot .wings { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #pp-boot .strip { position: absolute; left: 0; top: 0; width: 6200%; height: 100%; will-change: transform;
        background: url(/loading/letterwing-fly.webp) 0 0 / 100% 100% no-repeat; animation: pp-wings 5.1667s steps(62, jump-none) infinite; }
      #pp-boot .cap { position: absolute; top: 0; width: 65px; height: 44px; }
      #pp-boot .cap.l { left: -52px; } #pp-boot .cap.r { right: -52px; transform: scaleX(-1); }
      #pp-boot .sprig { position: absolute; top: -2px; width: 22px; height: 16px; margin-left: -11px; }
      #pp-boot .message { margin-top: 6px; font-size: 17px; line-height: 24px; color: #254E43; text-align: center; }
      @media (max-height: 699px) { #pp-boot { padding-bottom: 140px; } }
      @media (max-width: 599px) {
        #pp-boot .sky { height: 118px; }
        #pp-boot .rail { height: 92px; }
        #pp-boot .face { left: -67.5px; width: 135px; height: 92px; }
        #pp-boot .bar { width: max(120px, min(300px, calc(100vw - 159px))); }
      }
      @keyframes pp-wings { to { transform: translateX(-98.387%); } }
      @keyframes pp-bob { from { transform: translateY(-1.5px) rotate(-0.5deg); } to { transform: translateY(1.5px) rotate(0.5deg); } }
      @keyframes pp-band { from { transform: translateX(0); } to { transform: translateX(212.5%); } }
      @keyframes pp-follow { from { transform: translateX(16%); } to { transform: translateX(84%); } }
      @keyframes pp-face {
        0% { transform: scaleX(1); } 47% { transform: scaleX(1); }
        53% { transform: scaleX(-1); } 97% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #pp-boot .band, #pp-boot .mover { animation-duration: 3.2s; } #pp-boot .face { animation-duration: 6.4s; }
        #pp-boot .bob, #pp-boot .strip { animation: none; }
      }
    </style>
  </head>
  <body>

      You need to enable JavaScript to run this app.

9.6 9.5 21.5 Z" fill="#94B9A0" opacity="0.8"/> <ellipse cx="33" cy="13.6" rx="2.5" ry="3.5" fill="#F2CFCA" stroke="#E3B0AA" stroke-width=".4" transform="rotate(0 33 17)"/><ellipse cx="33" cy="13.6" rx="2.5" ry="3.5" fill="#F2CFCA" stroke="#E3B0AA" stroke-width=".4" transform="rotate(72 33 17)"/><ellipse cx="33" cy="13.6" rx="2.5" ry="3.5" fill="#F2CFCA" stroke="#E3B0AA" stroke-width=".4" transform="rotate(144 33 17)"/><ellipse cx="33" cy="13.6" rx="2.5" ry="3.5" fill="#F2CFCA" stroke="#E3B0AA" stroke-width=".4" transform="rotate(216 33 17)"/><ellipse cx="33" cy="13.6" rx="2.5" ry="3.5" fill="#F2CFCA" stroke="#E3B0AA" stroke-width=".4" transform="rotate(288 33 17)"/> <circle cx="33" cy="17" r="1.9" fill="#D9B25C"/> </svg></div></div>
          <div class="message" id="pp-boot-message">Preparing your garden…</div>
        </div>
      </div>
    </div>
    <script src="/loading/boot-clock.js"></script>
  </body>
</html>
